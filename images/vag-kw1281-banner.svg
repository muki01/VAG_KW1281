<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">VAG KW1281 - KW1281 diagnostics for VW, Audi, Skoda and SEAT on Arduino and ESP32</title>
  <desc id="d">Banner showing a KW1281 block 04 0B 29 01 03 that requests measuring group 01, with the complement byte the control unit sends back to acknowledge each byte.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="40%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="100%" r="55%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="440" rx="22"/></clipPath>
  </defs>
    <style>
      .glow{animation:hit 5s linear infinite}
      .ack{opacity:0;animation:hit 5s linear infinite}.b0 .glow{animation-delay:0s}.a0{animation-delay:0.45s}.b1 .glow{animation-delay:1s}.a1{animation-delay:1.45s}.b2 .glow{animation-delay:2s}.a2{animation-delay:2.45s}.b3 .glow{animation-delay:3s}.a3{animation-delay:3.45s}.b4 .glow{animation-delay:4s}.a4{animation-delay:4.45s}
      .scan{animation:scan 5s linear infinite}
      .live{animation:blink 1.6s ease-in-out infinite}
      .pin{animation:blink 1.6s ease-in-out infinite}
      .wave{animation:wave 3s ease-out infinite}
      .w2{animation-delay:.18s}.w3{animation-delay:.36s}
      .flow{animation:flow 1.2s linear infinite}
      @keyframes hit{0%{opacity:0}0.6%{opacity:1}18.0%{opacity:1}26.0%{opacity:0}100%{opacity:0}}
      @keyframes scan{from{transform:translateX(0)}to{transform:translateX(468px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      @keyframes wave{0%{opacity:0}10%{opacity:1}45%{opacity:1}70%{opacity:0}100%{opacity:0}}
      @keyframes flow{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){.glow,.ack,.scan,.live,.pin,.wave,.flow{animation:none}.scan{opacity:0}.ack{opacity:1}}
    </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <rect width="1280" height="440" fill="url(#glow1)"/>
    <rect width="1280" height="440" fill="url(#glow2)"/>

    <!-- left column -->
    <text x="64" y="96" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="2.4" fill="#22d3ee">VW · AUDI · SKODA · SEAT DIAGNOSTICS</text>
    <text x="60" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-2"><tspan fill="#f8fafc">VAG </tspan><tspan fill="url(#title)">KW1281</tspan></text>
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#cbd5e1">
      <tspan x="64" y="228">Talk to Volkswagen Group control units</tspan>
      <tspan x="64" y="259">over the K-Line with an Arduino or ESP32.</tspan>
    </text>
    <rect x="64" y="286" width="123" height="32" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="125.5" y="307" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#cbd5e1">5-baud init</text>
    <rect x="197" y="286" width="148" height="32" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="271.0" y="307" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#cbd5e1">block protocol</text>
    <rect x="355" y="286" width="166" height="32" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="438.0" y="307" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#cbd5e1">byte acknowledge</text>
    <text x="64" y="362" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#64748b">READS</text>
    <text x="64" y="386" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#94a3b8">ECU info · Measuring groups · Fault codes</text>

    <!-- right column -->
    <rect x="704" y="64" width="512" height="312" rx="18" fill="#0a101c" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".10"/>
    <circle class="live" cx="730" cy="91" r="5" fill="#34d399"/>
    <text x="744" y="96" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#94a3b8">KW1281  LIVE</text>
    <text x="1194" y="96" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#64748b">9600 8N1</text>
    <path d="M704 110H1216" stroke="#ffffff" stroke-opacity=".08"/>
    <path d="M712.0 126 H726.0 V164 H735.4 H744.7 H754.1 V126 H763.4 V164 H772.8 H782.2 H791.5 H800.9 H810.2 V126 H819.6 V164 H829.0 V126 H838.3 H847.7 V164 H857.0 V126 H866.4 V164 H875.8 H885.1 H894.5 H903.8 V126 H913.2 V164 H922.6 V126 H931.9 V164 H941.3 H950.6 V126 H960.0 V164 H969.4 V126 H978.7 V164 H988.1 H997.4 V126 H1006.8 V164 H1016.2 V126 H1025.5 V164 H1034.9 H1044.2 H1053.6 H1063.0 H1072.3 H1081.7 H1091.0 V126 H1100.4 V164 H1109.8 V126 H1119.1 H1128.5 V164 H1137.8 H1147.2 H1156.6 H1165.9 H1175.3 H1184.6 V126 H1194.0 H1208.0" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
    <rect class="scan" x="725" y="118" width="2" height="54" fill="#cffafe" opacity=".85"/>
    <g class="byte b0">
      <rect x="766.0" y="202" width="68" height="64" rx="10" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.5"/>
      <rect class="glow" x="766.0" y="202" width="68" height="64" rx="10" fill="#22d3ee" fill-opacity=".22" stroke="#22d3ee" stroke-width="2" opacity="0"/>
      <text x="800.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#f8fafc">04</text>
      <text x="800.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#22d3ee">LEN</text>
    </g>
    <text class="ack a0" x="800.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#64748b">&#8617; FB</text>
    <g class="byte b1">
      <rect x="846.0" y="202" width="68" height="64" rx="10" fill="#94a3b8" fill-opacity=".10" stroke="#94a3b8" stroke-opacity=".55" stroke-width="1.5"/>
      <rect class="glow" x="846.0" y="202" width="68" height="64" rx="10" fill="#94a3b8" fill-opacity=".22" stroke="#94a3b8" stroke-width="2" opacity="0"/>
      <text x="880.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#f8fafc">0B</text>
      <text x="880.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#94a3b8">CNT</text>
    </g>
    <text class="ack a1" x="880.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#64748b">&#8617; F4</text>
    <g class="byte b2">
      <rect x="926.0" y="202" width="68" height="64" rx="10" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".55" stroke-width="1.5"/>
      <rect class="glow" x="926.0" y="202" width="68" height="64" rx="10" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="2" opacity="0"/>
      <text x="960.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#f8fafc">29</text>
      <text x="960.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#34d399">TITLE</text>
    </g>
    <text class="ack a2" x="960.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#64748b">&#8617; D6</text>
    <g class="byte b3">
      <rect x="1006.0" y="202" width="68" height="64" rx="10" fill="#818cf8" fill-opacity=".10" stroke="#818cf8" stroke-opacity=".55" stroke-width="1.5"/>
      <rect class="glow" x="1006.0" y="202" width="68" height="64" rx="10" fill="#818cf8" fill-opacity=".22" stroke="#818cf8" stroke-width="2" opacity="0"/>
      <text x="1040.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#f8fafc">01</text>
      <text x="1040.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#818cf8">GROUP</text>
    </g>
    <text class="ack a3" x="1040.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#64748b">&#8617; FE</text>
    <g class="byte b4">
      <rect x="1086.0" y="202" width="68" height="64" rx="10" fill="#c084fc" fill-opacity=".10" stroke="#c084fc" stroke-opacity=".55" stroke-width="1.5"/>
      <rect class="glow" x="1086.0" y="202" width="68" height="64" rx="10" fill="#c084fc" fill-opacity=".22" stroke="#c084fc" stroke-width="2" opacity="0"/>
      <text x="1120.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#f8fafc">03</text>
      <text x="1120.0" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#c084fc">END</text>
    </g>
    <path d="M704 316H1216" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="726" y="348" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e2e8f0">Read group <tspan fill="#67e8f9">01</tspan></text>
    <text x="1194" y="348" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#34d399">complement handshake</text>
  </g>
</svg>
