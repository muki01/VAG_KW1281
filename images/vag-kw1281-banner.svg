<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">VAG KW1281 - KW1281 diagnostics for VW, Audi, Skoda and SEAT on Arduino and ESP32</title>
  <desc id="d">Banner showing a KW1281 block 04 0B 29 01 03 that requests measuring group 01, with the complement byte the control unit sends back to acknowledge each byte.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="40%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="100%" r="55%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="480" rx="22"/></clipPath>
  </defs>
    <style>
      .glow{animation:hit 5s linear infinite}
      .ack{opacity:0;animation:hit 5s linear infinite}.b0 .glow{animation-delay:0s}.a0{animation-delay:0.45s}.b1 .glow{animation-delay:1s}.a1{animation-delay:1.45s}.b2 .glow{animation-delay:2s}.a2{animation-delay:2.45s}.b3 .glow{animation-delay:3s}.a3{animation-delay:3.45s}.b4 .glow{animation-delay:4s}.a4{animation-delay:4.45s}
      .scan{animation:scan 5s linear infinite}
      .live{animation:blink 1.6s ease-in-out infinite}
      .pin{animation:blink 1.6s ease-in-out infinite}
      .wave{animation:wave 3s ease-out infinite}
      .w2{animation-delay:.18s}.w3{animation-delay:.36s}
      .flow{animation:flow 1.2s linear infinite}
      @keyframes hit{0%{opacity:0}0.6%{opacity:1}18.0%{opacity:1}26.0%{opacity:0}100%{opacity:0}}
      @keyframes scan{from{transform:translateX(0)}to{transform:translateX(478px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      @keyframes wave{0%{opacity:0}10%{opacity:1}45%{opacity:1}70%{opacity:0}100%{opacity:0}}
      @keyframes flow{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){.glow,.ack,.scan,.live,.pin,.wave,.flow{animation:none}.scan{opacity:0}.ack{opacity:1}}
    </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#grid)"/>
    <rect width="1280" height="480" fill="url(#glow1)"/>
    <rect width="1280" height="480" fill="url(#glow2)"/>

    <!-- left column -->
    <text x="64" y="77" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" letter-spacing="2.9" fill="#22d3ee">VW · AUDI · SKODA · SEAT DIAGNOSTICS</text>
    <text x="60" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.8" fill="#f8fafc">VAG</text>
    <text x="60" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.8" fill="url(#title)">KW1281</text>
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#cbd5e1">
      <tspan x="64" y="272">Talk to Volkswagen Group control units</tspan>
      <tspan x="64" y="310">over the K-Line with an Arduino or ESP32.</tspan>
    </text>
    <rect x="64" y="338" width="139" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="133.5" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">5-baud init</text>
    <rect x="211" y="338" width="170" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="296" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">block protocol</text>
    <rect x="389" y="338" width="190" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="484" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">byte acknowledge</text>
    <text x="64" y="413" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#8a97ab">ECU info · Measuring groups · Fault codes</text>

    <!-- right column: analyzer panel -->
    <g transform="translate(664 50)">
      <rect x=".5" y=".5" width="551" height="379" rx="20" fill="#0a101c" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".10"/>
      <circle class="live" cx="29" cy="30" r="5" fill="#34d399"/>
      <text x="44" y="35" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="1.5" fill="#94a3b8">KW1281  LIVE</text>
      <text x="528" y="35" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#64748b">9600 8N1</text>
      <path d="M0 56H552" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24.0 72.0H38.2V140.0H47.8H57.2H66.8V72.0H76.2V140.0H85.8H95.3H104.8H114.3H123.8V72.0H133.3V140.0H142.9V72.0H152.3H161.9V140.0H171.3V72.0H180.9V140.0H190.4H199.9H209.4H218.9V72.0H228.4V140.0H238.0V72.0H247.4V140.0H257.0H266.4V72.0H276.0V140.0H285.6V72.0H295.0V140.0H304.6H314.0V72.0H323.6V140.0H333.1V72.0H342.6V140.0H352.1H361.6H371.1H380.7H390.1H399.7H409.1V72.0H418.7V140.0H428.2V72.0H437.7H447.2V140.0H456.7H466.2H475.8H485.2H494.8H504.2V72.0H513.8H528.0" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
      <rect class="scan" x="37" y="64" width="2" height="84" fill="#cffafe" opacity=".85"/>
      <g class="byte b0"><rect x="67" y="188" width="74" height="88" rx="12" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="67" y="188" width="74" height="88" rx="12" fill="#22d3ee" fill-opacity=".22" stroke="#22d3ee" stroke-width="2" opacity="0"/><text x="104" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">04</text><text x="104" y="302" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#22d3ee">LEN</text></g>
      <text class="ack a0" x="104" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#64748b">&#8617; FB</text>
      <g class="byte b1"><rect x="153" y="188" width="74" height="88" rx="12" fill="#94a3b8" fill-opacity=".10" stroke="#94a3b8" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="153" y="188" width="74" height="88" rx="12" fill="#94a3b8" fill-opacity=".22" stroke="#94a3b8" stroke-width="2" opacity="0"/><text x="190" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">0B</text><text x="190" y="302" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#94a3b8">CNT</text></g>
      <text class="ack a1" x="190" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#64748b">&#8617; F4</text>
      <g class="byte b2"><rect x="239" y="188" width="74" height="88" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="239" y="188" width="74" height="88" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="2" opacity="0"/><text x="276" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">29</text><text x="276" y="302" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#34d399">TITLE</text></g>
      <text class="ack a2" x="276" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#64748b">&#8617; D6</text>
      <g class="byte b3"><rect x="325" y="188" width="74" height="88" rx="12" fill="#818cf8" fill-opacity=".10" stroke="#818cf8" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="325" y="188" width="74" height="88" rx="12" fill="#818cf8" fill-opacity=".22" stroke="#818cf8" stroke-width="2" opacity="0"/><text x="362" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">01</text><text x="362" y="302" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#818cf8">GROUP</text></g>
      <text class="ack a3" x="362" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#64748b">&#8617; FE</text>
      <g class="byte b4"><rect x="411" y="188" width="74" height="88" rx="12" fill="#c084fc" fill-opacity=".10" stroke="#c084fc" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="411" y="188" width="74" height="88" rx="12" fill="#c084fc" fill-opacity=".22" stroke="#c084fc" stroke-width="2" opacity="0"/><text x="448" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">03</text><text x="448" y="302" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#c084fc">END</text></g>
      <path d="M0 322H552" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="24" y="358" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#e2e8f0">Read group <tspan fill="#67e8f9">01</tspan></text>
      <text x="528" y="358" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#34d399">complement handshake</text>
    </g>
  </g>
</svg>
